[package]
name = "sound-manager-core"
version = "4.0.0-dev"
edition = "2021"
license = "CDDL-1.0"
description = "Core domain + platform logic for Sound Manager (shared by app and bg-sound-player sidecar)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
log = "0.4"
chrono = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
hound = "3.5"
symphonia = { version = "0.5", default-features = false, features = ["wav", "mp3", "ogg", "flac", "isomp4"] }
aes = "0.8"
cbc = "0.1"
des = "0.8"
cipher = { version = "0.4", features = ["block-padding", "alloc"] }
base64 = "0.22"
md-5 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg"] }
once_cell = "1.20"
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media_Audio",
] }
